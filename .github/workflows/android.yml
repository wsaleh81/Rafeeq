name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rihal-source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: rihal-source/package-lock.json }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Build APK
        working-directory: rihal-source/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Rihal.apk
      - uses: actions/upload-artifact@v4
        with: { name: Rihal-apk, path: rihal-source/Rihal.apk }
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Rihal.apk --title "Rihal رفيق (Android)" --notes "Download Rihal.apk, open it on your Android phone and install. Allow installs from this source if asked." --latest
  pages:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rihal-source
    permissions: { contents: read, pages: write, id-token: write }
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: rihal-source/package-lock.json }
      - run: npm ci && npm run build
      - uses: actions/configure-pages@v5
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v3
        with: { path: rihal-source/www }
      - id: d
        uses: actions/deploy-pages@v4
        continue-on-error: true
