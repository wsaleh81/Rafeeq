name: Build for Google Play
# Builds the Android App Bundle (.aab) for Google Play and a release APK.
# Signs them when the RIHAL_* repository secrets are set
# (Settings > Secrets and variables > Actions); otherwise builds unsigned to check the build.
on:
  push:
    branches: [main, play-release]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bundle:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rihal-source
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: rihal-source/package-lock.json }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Restore upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RIHAL_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/rihal-upload.jks"
            echo "RIHAL_KEYSTORE_PATH=$RUNNER_TEMP/rihal-upload.jks" >> "$GITHUB_ENV"
            echo "SIGNED=yes" >> "$GITHUB_ENV"
          else
            echo "No signing secrets: building unsigned (cannot be uploaded to Google Play)."
            echo "SIGNED=no" >> "$GITHUB_ENV"
          fi
      - name: Build bundle and APK
        working-directory: rihal-source/android
        env:
          RIHAL_KEYSTORE_PASSWORD: ${{ secrets.RIHAL_KEYSTORE_PASSWORD }}
          RIHAL_KEY_ALIAS: ${{ secrets.RIHAL_KEY_ALIAS }}
          RIHAL_KEY_PASSWORD: ${{ secrets.RIHAL_KEY_PASSWORD }}
        run: chmod +x gradlew && ./gradlew bundleRelease assembleRelease assembleDebug --no-daemon
      - name: Collect files
        run: |
          mkdir -p out
          cp android/app/build/outputs/bundle/release/app-release.aab "out/Rihal-$VERSION_CODE.aab"
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/Rihal-$VERSION_CODE-test.apk"
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: Rihal-play-${{ github.run_number }}
          path: rihal-source/out
      - name: Publish build to GitHub release "play-build"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete play-build --yes --cleanup-tag || true
          gh release create play-build out/* --prerelease --target "$GITHUB_SHA" \
            --title "Rihal Google Play build $VERSION_CODE (signed: $SIGNED)" \
            --notes "Upload Rihal-$VERSION_CODE.aab to Google Play Console. Version code $VERSION_CODE, signed: $SIGNED."
